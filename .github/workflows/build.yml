name: DiscoverLanka build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Kandy hero image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('public/hero-kandy-real.b64') != ''
        run: |
          set -euo pipefail
          tr -d '\n\r ' < public/hero-kandy-real.b64 | base64 --decode > public/hero-home.jpg
          file public/hero-home.jpg
          identify public/hero-home.jpg
          rm -f public/hero-kandy-real.b64 public/hero-kandy-full.b64 public/hero-kandy-optimized.txt public/hero-image-source.txt
          rm -f public/hero-home-data.txt public/hero-home-fixed.jpg public/hero-home-repair.txt public/hero-home.bin
          rm -f hero-binary-source*.txt hero-upload/part01.txt hero-upload/part02.txt
          rmdir hero-upload 2>/dev/null || true
          rm -f public/hero/.keep public/hero/.noop public/hero/README.txt public/hero/kandy-lake.tmp public/hero/kandy-lake.jpg
          rm -f .github/workflows/restore-hero-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-home.jpg
          git add -u
          git commit -m "fix: restore exact Kandy hero image"
          git push
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build

      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push
          fi
