name: Convert hero image asset

on:
  push:
    branches: [main]
    paths:
      - "public/hero-home.jpg"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and convert base64 hero image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('public/hero-home.jpg')
          data = p.read_bytes()
          if data.startswith(b'\xff\xd8\xff'):
              print('Hero image is already binary JPEG; nothing to do.')
              raise SystemExit(0)
          text = data.decode('utf-8').strip()
          if not text.startswith('/9j/'):
              raise SystemExit('Hero image is neither a JPEG nor JPEG base64 text.')
          raw = base64.b64decode(text)
          if not raw.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Decoded hero image is not a JPEG.')
          p.write_bytes(raw)
          print(f'Converted base64 hero image to binary JPEG ({len(raw)} bytes).')
          PY
          file public/hero-home.jpg
          test "$(xxd -p -l 3 public/hero-home.jpg)" = "ffd8ff"

      - name: Commit converted hero image
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/hero-home.jpg; then
            echo "No conversion needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-home.jpg
          git commit -m "fix: convert hero image to binary asset"
          git push
