name: Restore uploaded hero image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'restore uploaded hero image') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore uploaded hero image
        run: |
          set -euo pipefail
          test -f hero-upload/part01.txt
          cat hero-upload/part*.txt | tr -d '\n\r ' | base64 --decode > public/hero-home.jpg
          file public/hero-home.jpg
          identify public/hero-home.jpg

      - name: Remove temporary hero staging files
        run: |
          rm -f hero-upload/part*.txt
          rmdir hero-upload 2>/dev/null || true

      - name: Commit uploaded hero image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-home.jpg
          git add -u hero-upload || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore uploaded hero image"
          git push
