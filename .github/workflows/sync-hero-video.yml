name: Sync DiscoverLanka hero video

on:
  push:
    branches: [main]
    paths:
      - "components/LuxuryInteractions.tsx"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download public hero video
        run: |
          mkdir -p public/hero
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            "https://drive.usercontent.google.com/download?export=download&id=1AC9-f3h4WRnM2pSVLX-ab_zgjghLJF0V&confirm=t" \
            -o public/hero/srilankantravel.mp4
          file public/hero/srilankantravel.mp4
          test -s public/hero/srilankantravel.mp4

      - name: Commit hero video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero/srilankantravel.mp4
          if git diff --cached --quiet; then
            echo "Hero video is already synced."
            exit 0
          fi
          git commit -m "chore: add DiscoverLanka hero video"
          git push
